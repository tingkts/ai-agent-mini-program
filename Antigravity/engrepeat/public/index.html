<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雙語智慧翻譯官 - KK音標與循環發音學習系統</title>
  <meta name="description" content="專為中英雙語學習者設計的智慧型翻譯工具。提供精準的 Google 翻譯，自動標示美式 KK 音標，支援語音循環播放與符合年月日時分命名的音檔下載，是您練習發音與例句的好夥伴。">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- Header -->
    <header>
      <h1>雙語智慧翻譯官</h1>
      <p>中英雙向翻譯 • 美式 KK 音標標記 • 循環朗讀練習 • 高清音檔下載</p>
    </header>

    <!-- Main Workspace Card -->
    <main class="glass-card">
      
      <!-- Mode Selection -->
      <div class="language-selector">
        <button id="mode-auto" class="toggle-btn active" onclick="setMode('auto')">
          <span>🔍 自動偵測</span>
        </button>
        <button id="mode-zh-en" class="toggle-btn" onclick="setMode('zh-en')">
          <span>🇨🇳 中文 ➔ 英文 🇺🇸</span>
        </button>
        <button id="mode-en-zh" class="toggle-btn" onclick="setMode('en-zh')">
          <span>🇺🇸 英文 ➔ 中文 🇨🇳</span>
        </button>
      </div>

      <!-- Input Text Area -->
      <div class="input-wrapper">
        <textarea id="input-text" placeholder="請輸入中文或英文單字或句子進行翻譯..." maxlength="500"></textarea>
        <div id="char-count" class="char-counter">0 / 500</div>
      </div>

      <!-- Warning Guard Box -->
      <div id="warning-box" class="warning-message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="warning-text">只接受中文與英文輸入</span>
      </div>

      <!-- Submit Action Bar -->
      <div class="action-bar">
        <button id="translate-submit-btn" class="primary-btn" onclick="handleTranslation()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="20" y2="20"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          開始翻譯與分析
        </button>
      </div>

    </main>

    <!-- Dynamic Results Container -->
    <div id="results-area" class="results-container">
      
      <!-- 1. Main Translation Card -->
      <section id="card-main-result" class="glass-card">
        <div class="card-header">
          <h2 class="card-title">翻譯與音標分析</h2>
        </div>
        
        <div id="translation-output" class="translation-box">
          <!-- Translated text goes here -->
        </div>

        <!-- Phonetic Grid Panel (visible if English is present) -->
        <div id="phonetic-panel" class="phonetics-panel" style="display:none;">
          <div id="phonetic-grid" class="phonetic-grid">
            <!-- Token-grid of word/KK symbols -->
          </div>
        </div>

        <!-- Custom Pronunciation Player -->
        <div class="custom-audio-player">
          <div class="player-controls">
            <button id="main-play-btn" class="play-pause-btn" onclick="togglePlay('main')">
              <svg id="main-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <svg id="main-pause-icon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <div class="player-info">
              <span class="player-label">主內容語音</span>
              <span id="main-player-status" class="player-status">已停止播放</span>
            </div>
          </div>
          <div class="player-actions">
            <button id="main-loop-btn" class="player-btn loop-active" onclick="toggleLoop('main')">
              🔄 循環播放
            </button>
            <button id="main-download-btn" class="player-btn download-btn" onclick="downloadAudio('main')">
              📥 下載音檔
            </button>
          </div>
        </div>
      </section>

      <!-- 2. Common Example Sentences Card -->
      <section id="card-example-result" class="glass-card">
        <div class="card-header">
          <h2 class="card-title">常用學習例句</h2>
        </div>

        <div id="example-sentences-list" class="example-section">
          <!-- Will be filled dynamically with example sentence rows -->
        </div>
      </section>

    </div>

    <!-- 3. Learning History Log Card (PC / Tablet / Mobile Compatible) -->
    <section id="card-history-section" class="glass-card" style="margin-top: 1.5rem;">
      <div class="card-header">
        <h2 class="card-title">📜 學習歷史紀錄 (點擊可快速載入複習)</h2>
        <button id="clear-history-btn" class="clear-btn" onclick="clearAllHistory()">
          🗑️ 清空紀錄
        </button>
      </div>
      <div id="history-list" class="history-grid">
        <!-- History items will be rendered dynamically -->
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <p>© 2026 雙語智慧翻譯官 - 專注發音與例句口語學習</p>
    </footer>

  </div>

  <!-- Hidden standard audio tags managed by JS script -->
  <audio id="audio-main" style="display:none;"></audio>
  <audio id="audio-example1" style="display:none;"></audio>
  <audio id="audio-example2" style="display:none;"></audio>
  <audio id="audio-example3" style="display:none;"></audio>

  <script src="app.js"></script>
</body>
</html>

databases:
  - name: footprint-db
    databaseName: footprints
    user: footprint_user
    plan: free

services:
  - type: web
    name: footprint-tracker-y
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: footprint-db
          property: connectionString
      - key: ALERT_DISTANCE_KM
        value: 1.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

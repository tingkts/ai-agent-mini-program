<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Y 的足跡追蹤與告警系統</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts & Phosphor Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-main);
    }

    /* 主佈局 - 桌面端：左右分割；手機端：地圖滿版 + 底部抽屜卡片 */
    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* 桌面版側邊欄 */
    .sidebar {
      width: 380px;
      height: 100%;
      background: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-shadow: 4px 0 24px rgba(0,0,0,0.3);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    .sidebar-content {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 統計卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-sub {
      font-size: 0.7rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* A 當前狀態 */
    .target-status-box {
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 12px;
      padding: 14px;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .target-status-box b {
      color: #60a5fa;
    }

    /* 按鈕樣式 */
    .btn {
      width: 100%;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: #334155;
      color: var(--text-main);
    }
    .btn-secondary:hover { background: #475569; }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }

    /* 里程碑歷史清單 */
    .milestone-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .milestone-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .milestone-item {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .milestone-item:hover {
      background: rgba(37, 99, 235, 0.15);
      border-color: var(--primary);
    }

    /* 地圖區域 */
    #map {
      flex: 1;
      height: 100%;
      background: #0b1120;
    }

    /* 手機版頂部浮動膠囊 */
    .mobile-header {
      display: none;
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      justify-content: space-between;
      align-items: center;
    }

    .mobile-header .title-group {
      display: flex;
      flex-direction: column;
    }

    .mobile-header h2 {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .mobile-header span {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    /* 手機版底部抽屜 (Bottom Sheet) */
    .mobile-bottom-sheet {
      display: none;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      border-radius: 20px 20px 0 0;
      padding: 16px 20px 24px 20px;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: #475569;
      border-radius: 2px;
      margin: 0 auto 12px auto;
    }

    .mobile-stats-row {
      display: flex;
      justify-content: space-around;
      margin-bottom: 14px;
      text-align: center;
    }

    .mobile-stat-col .num {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .mobile-stat-col .lbl {
      font-size: 0.7rem;
      color: var(--text-sub);
    }

    .mobile-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* 彈出視窗 (Modal) */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .modal-card h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .form-group input {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* 響應式切換 (手機平板 vs 桌面) */
    @media (max-width: 768px) {
      .sidebar {
        display: none; /* 手機端隱藏左側欄，使用滿版地圖與底部卡片 */
      }
      .mobile-header {
        display: flex;
      }
      .mobile-bottom-sheet {
        display: block;
      }
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Leaflet 地圖標記自訂微調 */
    .custom-pulse-marker {
      background: #2563eb;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(37,99,235,0.8);
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- 桌面版左側面板 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>
          <span>📍</span> Y 的即時足跡
        </h1>
        <div class="status-badge">
          <div class="status-dot"></div>
          <span id="desk-status-text">連線中</span>
        </div>
      </div>

      <div class="sidebar-content">
        <!-- 數據指標 -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">累積位移</div>
            <div class="stat-value" id="desk-total-dist">0.00 <span style="font-size:0.8rem">km</span></div>
            <div class="stat-sub">總記錄里程</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">1km 警報次數</div>
            <div class="stat-value" style="color: #f87171;" id="desk-total-alerts">0 <span style="font-size:0.8rem">次</span></div>
            <div class="stat-sub">位移達標次數</div>
          </div>
        </div>

        <!-- 最新狀態 -->
        <div class="target-status-box" id="desk-target-box">
          <div><b>最後更新：</b><span id="desk-last-time">尚未收到座標</span></div>
          <div><b>剩餘電量：</b><span id="desk-last-batt">--%</span></div>
          <div><b>目前座標：</b><span id="desk-last-coord">--</span></div>
          <div><b>儲存後端：</b><span id="desk-db-type" style="color:#34d399;">--</span></div>
        </div>

        <!-- 動作按鈕 -->
        <button class="btn btn-primary" onclick="focusCurrentLocation()">
          🎯 聚焦 Y 的最新位置
        </button>
        <button class="btn btn-secondary" onclick="openConfigModal()">
          ⚙️ Telegram 告警與門檻設定
        </button>
        <button class="btn btn-secondary" onclick="openSimulateModal()">
          🧪 測試位移模擬（室內測試）
        </button>
        <button class="btn btn-danger" onclick="confirmResetHistory()">
          🗑️ 清除所有足跡紀錄
        </button>

        <!-- 里程碑清單 -->
        <div class="milestone-title">🚩 1km 位移警報記錄</div>
        <div class="milestone-list" id="desk-milestones">
          <div style="font-size:0.8rem; color:var(--text-sub); text-align:center; padding:10px;">尚無警報紀錄</div>
        </div>
      </div>
    </aside>

    <!-- 手機版頂部浮動列 -->
    <div class="mobile-header">
      <div class="title-group">
        <h2>Y 的足跡追蹤</h2>
        <span id="mob-last-time">等待座標回傳...</span>
      </div>
      <button class="btn btn-secondary" style="width:auto; padding:6px 12px; font-size:0.75rem;" onclick="openConfigModal()">
        ⚙️ 設定
      </button>
    </div>

    <!-- 地圖主區域 -->
    <div id="map"></div>

    <!-- 手機版底部抽屜卡片 -->
    <div class="mobile-bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="mobile-stats-row">
        <div class="mobile-stat-col">
          <div class="num" id="mob-total-dist">0.0 km</div>
          <div class="lbl">總移動里程</div>
        </div>
        <div class="mobile-stat-col">
          <div class="num" style="color: #f87171;" id="mob-total-alerts">0 次</div>
          <div class="lbl">1km 警報次數</div>
        </div>
        <div class="mobile-stat-col">
          <div class="num" id="mob-batt">--%</div>
          <div class="lbl">目前電量</div>
        </div>
      </div>
      <div class="mobile-btn-group">
        <button class="btn btn-primary" onclick="focusCurrentLocation()">
          🎯 聚焦 Y 位置
        </button>
        <button class="btn btn-secondary" onclick="openSimulateModal()">
          🧪 模擬位移測試
        </button>
      </div>
    </div>

  </div>

  <!-- Telegram 設定 Modal -->
  <div class="modal-overlay" id="config-modal">
    <div class="modal-card">
      <h3>⚙️ 系統與 Telegram 警報設定</h3>
      <div class="form-group">
        <label>Telegram Bot Token</label>
        <input type="text" id="cfg-token" placeholder="例如: 7123456789:AAH..." />
      </div>
      <div class="form-group">
        <label>Telegram Chat ID</label>
        <input type="text" id="cfg-chatid" placeholder="例如: 123456789" />
      </div>
      <div class="form-group">
        <label>觸發警報距離 (公里 km)</label>
        <input type="number" step="0.1" id="cfg-dist" value="1.0" />
      </div>
      <button class="btn btn-secondary" onclick="testTelegram()">
        🔔 測試發送 Telegram 訊息
      </button>
      <div style="display:flex; gap:10px; margin-top:8px;">
        <button class="btn btn-secondary" onclick="closeConfigModal()">取消</button>
        <button class="btn btn-primary" onclick="saveConfig()">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- 模擬位移測試 Modal -->
  <div class="modal-overlay" id="simulate-modal">
    <div class="modal-card">
      <h3>🧪 模擬 Y 移動（免出門測試）</h3>
      <p style="font-size:0.8rem; color:var(--text-sub);">
        點擊以下按鈕會自動模擬 Y 向外移動，觸發 1km 判定與 Telegram 推播：
      </p>
      <button class="btn btn-primary" onclick="simulateMove(0.012, 0.012, '位移 1.5 公里')">
        🚶 模擬 Y 移動約 1.5 公里 (觸發警報)
      </button>
      <button class="btn btn-secondary" onclick="simulateMove(0.002, 0.002, '位移 0.2 公里')">
        🚶 模擬 Y 微幅移動 200 公尺 (不觸發)
      </button>
      <button class="btn btn-secondary" onclick="closeSimulateModal()">關閉</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 初始化地圖（預設台北座標，後續自動平移至 Y 所在點）
    const map = L.map('map', {
      zoomControl: false
    }).setView([25.033964, 121.564468], 14);

    // 縮放控制放置於右上角，避開手機版頂部與底部
    L.control.zoom({ position: 'topright' }).addTo(map);

    // 採用 OpenStreetMap 圖資
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let pathPolyline = L.polyline([], {
      color: '#3b82f6',
      weight: 5,
      opacity: 0.85,
      smoothFactor: 1
    }).addTo(map);

    let startMarker = null;
    let currentMarker = null;
    let alertMarkers = [];
    let latestCoords = null;
    let initialBoundsSet = false;

    // 自訂圖標
    const createMarkerHtml = (color, text) => {
      return `<div style="
        background:${color};
        color:white;
        border:2px solid white;
        border-radius:20px;
        padding:4px 8px;
        font-size:11px;
        font-weight:bold;
        white-space:nowrap;
        box-shadow:0 3px 8px rgba(0,0,0,0.4);
      ">${text}</div>`;
    };

    // 載入足跡資料
    async function loadFootprintData() {
      try {
        const [histRes, statsRes] = await Promise.all([
          fetch('/api/history'),
          fetch('/api/stats')
        ]);
        const history = await histRes.json();
        const stats = await statsRes.json();

        updateStatsUI(stats);
        renderMapPoints(history);
      } catch (err) {
        console.error("載入資料失敗:", err);
      }
    }

    function updateStatsUI(stats) {
      const dist = stats.total_distance_km || 0;
      const alerts = stats.total_alerts || 0;
      const latest = stats.latest;

      document.getElementById('desk-total-dist').innerHTML = `${dist.toFixed(2)} <span style="font-size:0.8rem">km</span>`;
      document.getElementById('desk-total-alerts').innerHTML = `${alerts} <span style="font-size:0.8rem">次</span>`;
      document.getElementById('mob-total-dist').innerText = `${dist.toFixed(1)} km`;
      document.getElementById('mob-total-alerts').innerText = `${alerts} 次`;
      if (stats.database_type) {
        document.getElementById('desk-db-type').innerText = stats.database_type;
      }

      if (latest) {
        latestCoords = [latest.latitude, latest.longitude];
        const battText = latest.battery != null ? `${latest.battery}%` : '未知';
        
        document.getElementById('desk-last-time').innerText = latest.created_at;
        document.getElementById('desk-last-batt').innerText = battText;
        document.getElementById('desk-last-coord').innerText = `${latest.latitude.toFixed(4)}, ${latest.longitude.toFixed(4)}`;
        
        document.getElementById('mob-last-time').innerText = `最後更新: ${latest.created_at.split(' ')[1]}`;
        document.getElementById('mob-batt').innerText = battText;
      }
    }

    function renderMapPoints(history) {
      if (!history || history.length === 0) return;

      const latlngs = history.map(p => [p.latitude, p.longitude]);
      pathPolyline.setLatLngs(latlngs);

      // 清除舊 Milestone 標記
      alertMarkers.forEach(m => map.removeLayer(m));
      alertMarkers = [];

      const deskMilestonesEl = document.getElementById('desk-milestones');
      deskMilestonesEl.innerHTML = '';

      history.forEach((p, idx) => {
        // 第一個點：起點
        if (idx === 0) {
          if (!startMarker) {
            const startIcon = L.divIcon({
              className: 'custom-start-marker',
              html: createMarkerHtml('#10b981', '🏁 起點'),
              iconSize: [50, 24],
              iconAnchor: [25, 12]
            });
            startMarker = L.marker([p.latitude, p.longitude], { icon: startIcon }).addTo(map);
          } else {
            startMarker.setLatLng([p.latitude, p.longitude]);
          }
          startMarker.bindPopup(`<b>🏁 追蹤起始點</b><br>時間: ${p.created_at}`);
        }

        // 1km 警報點
        if (p.is_alert && idx > 0) {
          const alertIcon = L.divIcon({
            className: 'custom-alert-marker',
            html: createMarkerHtml('#ef4444', `🚨 +${p.distance_from_last.toFixed(1)}km`),
            iconSize: [60, 24],
            iconAnchor: [30, 12]
          });
          const m = L.marker([p.latitude, p.longitude], { icon: alertIcon }).addTo(map);
          m.bindPopup(`<b>🚨 1km 移動里程碑</b><br>時間: ${p.created_at}<br>單次位移: ${p.distance_from_last.toFixed(2)} km`);
          alertMarkers.push(m);

          // 加入側邊欄列表
          const item = document.createElement('div');
          item.className = 'milestone-item';
          item.innerHTML = `
            <div>
              <b style="color:#f87171;">位移 ${p.distance_from_last.toFixed(2)} km</b>
              <div style="color:var(--text-sub); font-size:0.75rem;">${p.created_at}</div>
            </div>
            <span style="font-size:0.75rem; color:#60a5fa;">查看 ➔</span>
          `;
          item.onclick = () => {
            map.flyTo([p.latitude, p.longitude], 16);
            m.openPopup();
          };
          deskMilestonesEl.appendChild(item);
        }

        // 最後一個點：Y 當前最新位置
        if (idx === history.length - 1) {
          if (!currentMarker) {
            const currentIcon = L.divIcon({
              className: 'custom-pulse-marker',
              html: createMarkerHtml('#2563eb', '👤 Y 目前在此'),
              iconSize: [75, 24],
              iconAnchor: [37, 12]
            });
            currentMarker = L.marker([p.latitude, p.longitude], { icon: currentIcon }).addTo(map);
          } else {
            currentMarker.setLatLng([p.latitude, p.longitude]);
          }
          currentMarker.bindPopup(`<b>👤 Y 的當前最新位置</b><br>時間: ${p.created_at}<br>電量: ${p.battery || '--'}%`);
        }
      });

      // 首次載入自動適配視野
      if (!initialBoundsSet && latlngs.length > 0) {
        map.fitBounds(pathPolyline.getBounds(), { padding: [50, 50] });
        initialBoundsSet = true;
      }
    }

    function focusCurrentLocation() {
      if (latestCoords) {
        map.flyTo(latestCoords, 16);
        if (currentMarker) currentMarker.openPopup();
      } else {
        alert("目前尚未有 Y 的位置紀錄");
      }
    }

    // Modal 與設定邏輯
    async function openConfigModal() {
      const res = await fetch('/api/config');
      const cfg = await res.json();
      document.getElementById('cfg-token').value = cfg.telegram_bot_token || '';
      document.getElementById('cfg-chatid').value = cfg.telegram_chat_id || '';
      document.getElementById('cfg-dist').value = cfg.alert_distance_km || 1.0;
      document.getElementById('config-modal').style.display = 'flex';
    }

    function closeConfigModal() {
      document.getElementById('config-modal').style.display = 'none';
    }

    async function saveConfig() {
      const payload = {
        telegram_bot_token: document.getElementById('cfg-token').value,
        telegram_chat_id: document.getElementById('cfg-chatid').value,
        alert_distance_km: parseFloat(document.getElementById('cfg-dist').value)
      };
      await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      alert("設定儲存成功！");
      closeConfigModal();
    }

    async function testTelegram() {
      const res = await fetch('/api/test-telegram', { method: 'POST' });
      const data = await res.json();
      alert(data.message);
    }

    // 模擬測試
    function openSimulateModal() {
      document.getElementById('simulate-modal').style.display = 'flex';
    }

    function closeSimulateModal() {
      document.getElementById('simulate-modal').style.display = 'none';
    }

    async function simulateMove(dLat, dLon, desc) {
      let baseLat = latestCoords ? latestCoords[0] : 25.03396;
      let baseLon = latestCoords ? latestCoords[1] : 121.56447;
      const targetLat = baseLat + dLat;
      const targetLon = baseLon + dLon;

      const res = await fetch('/api/simulate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lat: targetLat, lon: targetLon, batt: 85 })
      });
      const data = await res.json();
      closeSimulateModal();
      loadFootprintData();
      focusCurrentLocation();
      alert(`已送出模擬點 (${desc})！\n計算位移: ${data.dist_from_alert_km} km\n是否觸發警報: ${data.is_alert ? '是 (已發 Telegram)' : '否'}`);
    }

    async function confirmResetHistory() {
      if (confirm("確定要清空所有足跡與紀錄嗎？")) {
        await fetch('/api/history', { method: 'DELETE' });
        location.reload();
      }
    }

    // 每 10 秒自動輪詢更新
    loadFootprintData();
    setInterval(loadFootprintData, 10000);
  </script>
</body>
</html>
